name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          rm -rf _site
          mkdir -p _site
          find . -maxdepth 1 -type f -name '*.html' -exec cp {} _site/ \;
          cp site.webmanifest _site/
          cp -R assets fonts _site/
          find _site -name '.DS_Store' -delete
          touch _site/.nojekyll
          test -f _site/index.html
          test "$(find _site -maxdepth 1 -type f -name '*.html' | wc -l)" -gt 0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
